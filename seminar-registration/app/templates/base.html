<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ event.name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if session.get('staff') %}
  <nav class="staff-nav" aria-label="Staff">
    <a href="{{ url_for('staff.scanner') }}">Scanner</a>
    <a href="{{ url_for('staff.admin') }}">Admin</a>
    <form method="post" action="{{ url_for('staff.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Log out</button>
    </form>
  </nav>
  {% endif %}
  <header class="event-header">
    <p class="eyebrow">Seminar Registration</p>
    <h1>{{ event.name }}</h1>
    <ul class="event-meta">
      <li><span>Date</span> {{ event.date }}</li>
      <li><span>Venue</span> {{ event.venue }}</li>
    </ul>
  </header>
  <main class="container{% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
