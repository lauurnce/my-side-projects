<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="My Side Projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#e2e8ee"/>
    </linearGradient>
    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="3.5" y1="0" x2="3.5" y2="7" stroke="#c4cfd9" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f7ff"/>
      <stop offset="0.4" stop-color="#6fcbf5"/>
      <stop offset="1" stop-color="#1877b8"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#aab6c2"/>
      <stop offset="0.52" stop-color="#66768a"/>
      <stop offset="1" stop-color="#e1e7ed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur">
        <animate attributeName="stdDeviation" values="5;12;5" dur="2.8s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feFlood flood-color="#5cc3f3" flood-opacity="0.85" result="tint"/>
      <feComposite in="tint" in2="blur" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="c1" d="M150 52 L188 48 L176 118 L198 112 L186 196 L208 190 L190 316 L162 318 L170 230 L146 236 L158 150 L134 156 Z"/>
    <path id="c2" d="M150 52 L188 48 L176 118 L198 112 L186 196 L208 190 L190 316 L162 318 L170 230 L146 236 L158 150 L134 156 Z" transform="translate(78 -6) rotate(-5 250 180)"/>
    <path id="c3" d="M150 52 L188 48 L176 118 L198 112 L186 196 L208 190 L190 316 L162 318 L170 230 L146 236 L158 150 L134 156 Z" transform="translate(156 -12) rotate(-10 330 180)"/>
    <clipPath id="clawClip">
      <use href="#c1"/>
      <use href="#c2"/>
      <use href="#c3"/>
    </clipPath>
    <clipPath id="titleClip">
      <text x="430" y="176" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="900" letter-spacing="3" textLength="690" lengthAdjust="spacingAndGlyphs">MY SIDE PROJECTS</text>
    </clipPath>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#brush)"/>
  <g fill="url(#ice)" filter="url(#glow)">
    <use href="#c1"/>
    <use href="#c2"/>
    <use href="#c3"/>
  </g>
  <g clip-path="url(#clawClip)">
    <rect x="-260" y="0" width="200" height="360" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" from="-260" to="720" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="430" y="176" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="900" letter-spacing="3" textLength="690" lengthAdjust="spacingAndGlyphs" fill="url(#chrome)" stroke="#7a8898" stroke-width="1">MY SIDE PROJECTS</text>
  <g clip-path="url(#titleClip)">
    <rect x="200" y="80" width="160" height="120" fill="url(#shine)" transform="skewX(-25)">
      <animate attributeName="x" from="200" to="1300" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M432 194 H1120" stroke="url(#ice)" stroke-width="4" stroke-linecap="round" stroke-dasharray="688" stroke-dashoffset="688">
    <animate attributeName="stroke-dashoffset" values="688;0;0;688" keyTimes="0;0.35;0.75;1" dur="5.5s" repeatCount="indefinite"/>
  </path>
  <text x="432" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="3" fill="#5f6f7e">SIDE PROJECTS AND SCHOOL WORK, COMPILED IN ONE PLACE</text>
  <g transform="translate(432 250)">
    <rect width="214" height="34" rx="17" fill="#ffffff" stroke="#5cc3f3" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="107" y="23" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#1877b8">ZERO EXTRA REPOS</text>
  </g>
  <g fill="#9fdcf7" stroke="#ffffff" stroke-width="1">
    <circle cx="70" cy="350" r="4"><animate attributeName="cy" from="370" to="-10" dur="7s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0.8;0" dur="7s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="350" r="2.5"><animate attributeName="cy" from="370" to="-10" dur="5.5s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0.7;0" dur="5.5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="350" r="3"><animate attributeName="cy" from="370" to="-10" dur="8s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0.6;0" dur="8s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="350" r="5"><animate attributeName="cy" from="370" to="-10" dur="6.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.5;0" dur="6.5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="350" r="3.5"><animate attributeName="cy" from="370" to="-10" dur="7.5s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0.6;0" dur="7.5s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="350" r="2.5"><animate attributeName="cy" from="370" to="-10" dur="5s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0.7;0" dur="5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="350" r="6"><animate attributeName="cy" from="370" to="-10" dur="9s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" dur="9s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="350" r="3"><animate attributeName="cy" from="370" to="-10" dur="6s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0.7;0" dur="6s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="350" r="4"><animate attributeName="cy" from="370" to="-10" dur="7.2s" begin="-3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0.6;0" dur="7.2s" begin="-3.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
