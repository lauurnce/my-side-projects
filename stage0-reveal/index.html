:root{
--font:"Michroma","Eurostile Extended","Arial Black",sans-serif;
--bg:#04070c;
--accent:#62d6ff;
--accent-rgb:98,214,255;
--fog:46,110,160;
--steel-a:#f3f6f9;--steel-b:#aeb8c3;--steel-c:#5c6975;--steel-d:#d6dee5;--steel-e:#7d8994;--steel-f:#eaeff3;
--scale:1;
}
:root[data-theme="red"]{
--bg:#0a0405;
--accent:#ff5a3c;
--accent-rgb:255,90,60;
--fog:150,38,30;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--font);text-transform:uppercase;color:#dfe6ec;-webkit-font-smoothing:antialiased}
body:not([data-phase="setup"]){cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--scale));background:var(--bg);overflow:hidden}
#world{position:absolute;inset:0}
#world.shake{animation:shake .55s cubic-bezier(.3,.7,.3,1)}
#world.shake-big{animation:shake-big .8s cubic-bezier(.3,.7,.3,1)}
@keyframes shake{0%{transform:translate(0,0)}12%{transform:translate(-16px,9px)}25%{transform:translate(14px,-7px)}38%{transform:translate(-9px,5px)}50%{transform:translate(7px,-4px)}65%{transform:translate(-4px,3px)}80%{transform:translate(2px,-2px)}100%{transform:translate(0,0)}}
@keyframes shake-big{0%{transform:translate(0,0) scale(1.02)}10%{transform:translate(-28px,16px) scale(1.02)}22%{transform:translate(24px,-14px) scale(1.015)}34%{transform:translate(-16px,10px) scale(1.01)}46%{transform:translate(12px,-8px)}60%{transform:translate(-7px,5px)}75%{transform:translate(4px,-3px)}100%{transform:translate(0,0)}}
#fog,#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#horizon{position:absolute;left:0;right:0;top:40%;height:420px;background:radial-gradient(ellipse 55% 50% at 50% 100%,rgba(var(--accent-rgb),.18),transparent 70%);pointer-events:none}
#floor{position:absolute;left:-30%;right:-30%;bottom:-10%;height:100%;transform-origin:50% 100%;transform:perspective(900px) rotateX(62deg);background-image:linear-gradient(90deg,rgba(var(--accent-rgb),.6) 0 2px,transparent 2px),linear-gradient(0deg,rgba(var(--accent-rgb),.6) 0 2px,transparent 2px);background-size:110px 110px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.9) 60%,rgba(0,0,0,.7) 100%);mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.9) 60%,rgba(0,0,0,.7) 100%);animation:floor 5s linear infinite;pointer-events:none}
@keyframes floor{to{background-position:0 110px,0 110px}}

<body data-phase="setup">
<div id="stage">
<div id="world">
<canvas id="fog" width="1920" height="1080"></canvas>
<div id="horizon"></div>
<div id="floor"></div>
<div id="vignette"></div>
<section id="setup">
<form class="panel" id="form">
<p class="eyebrow">Stage 0 · Zero Vector Philippines</p>
<h1>Broadcast Setup</h1>
<div class="cols">
<div>
<div class="field"><label for="header-input"><span>Header text</span></label><input id="header-input" type="text" maxlength="40" autocomplete="off" spellcheck="false"></div>
<div class="field"><span class="lbl">Theme</span><div class="seg" id="theme-seg"><button type="button" data-theme="blue" aria-pressed="true">Blue</button><button type="button" data-theme="red" aria-pressed="false">Red</button></div></div>
<div class="field"><label for="seconds-input"><span>Seconds per team</span><output id="seconds-out">5 s</output></label><input id="seconds-input" type="range" min="3" max="10" step="1" value="5"></div>
<div class="field row"><div><label for="volume-input"><span>Master volume</span><output id="volume-out">80%</output></label><input id="volume-input" type="range" min="0" max="1" step="0.01" value="0.8"></div><button type="button" class="ghost" id="test-sound">Test sound</button></div>
</div>
<div>
<div class="field"><label for="teams-input"><span>Team names · one per line</span><output id="count-out">0 teams</output></label><textarea id="teams-input" spellcheck="false"></textarea></div>
</div>
</div>

<p class="hint">Space pause · → next · C copy order · F fullscreen · Esc setup · Shift+R reshuffle</p>
</form>

</section>

<div id="curtain"></div>
</div>
<div id="toast">Order copied</div>
<div id="measure"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const TEST = params.get('test') === '1';
const STORAGE_KEY = 'stage0-reveal-setup';
const WIDTH = 1920;
const HEIGHT = 1080;
const DEFAULTS = { header: 'ROUND 1 PRESENTERS', theme: 'blue', teams: '', seconds: 5, volume: 0.8 };

const ui = {
  form: $('form'),
  header: $('header-input'),
  themeSeg: $('theme-seg'),
  seconds: $('seconds-input'),
  secondsOut: $('seconds-out'),
  volume: $('volume-input'),
  volumeOut: $('volume-out'),
  teams: $('teams-input'),
  countOut: $('count-out'),
  test: $('test-sound'),
  start: $('start')
};
const show = {
  stage: $('stage'),
  world: $('world'),
  header: $('header'),
  reveal: $('reveal'),
  label: $('label'),
  stack: $('stack'),
  final: $('final'),
  plates: $('plates'),
  flash: $('flash'),
  curtain: $('curtain'),
  toast: $('toast'),
  measure: $('measure')
};

let theme = 'blue';
let runId = 0;
let paused = false;
let skipRequested = false;
let teams = [];
let order = [];
let holdSeconds = 5;

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function fitStage() {
  const scale = Math.min(innerWidth / WIDTH, innerHeight / HEIGHT);
  document.documentElement.style.setProperty('--scale', scale);
}

const fog = (() => {
  const canvas = $('fog');
  const ctx = canvas.getContext('2d');
  const blobs = [];
  const particles = [];
  let sprite = null;
  let accentRgb = '98,214,255';
  let last = performance.now();

  function retint() {
    const style = getComputedStyle(document.documentElement);
    const rgb = style.getPropertyValue('--fog').trim();
    accentRgb = style.getPropertyValue('--accent-rgb').trim();
    sprite = document.createElement('canvas');
    sprite.width = 512;
    sprite.height = 512;
    const c = sprite.getContext('2d');
    const g = c.createRadialGradient(256, 256, 0, 256, 256, 256);
    g.addColorStop(0, `rgba(${rgb},.5)`);
    g.addColorStop(0.4, `rgba(${rgb},.18)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g;
    c.fillRect(0, 0, 512, 512);
  }

  function seed() {
    for (let i = 0; i < 16; i++) {
      blobs.push({
        x: Math.random() * WIDTH,
        y: HEIGHT * 0.3 + Math.random() * HEIGHT * 0.9,
        size: 700 + Math.random() * 1100,
        vx: 8 + Math.random() * 16,
        drift: Math.random() * Math.PI * 2,
        alpha: 0.18 + Math.random() * 0.22
      });
    }
  }

  function burst(rect) {
    for (let i = 0; i < 260; i++) {
      particles.push({
        x: rect.x + Math.random() * rect.w,
        y: rect.y + Math.random() * rect.h,
        vx: (Math.random() - 0.5) * 220,
        vy: -60 - Math.random() * 260,
        life: 0.7 + Math.random() * 0.9,
        age: 0,
        r: 0.8 + Math.random() * 2.4
      });
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    for (const b of blobs) {
      b.x += b.vx * dt;
      b.drift += dt * 0.25;
      const y = b.y + Math.sin(b.drift) * 40;
      if (b.x - b.size / 2 > WIDTH) b.x = -b.size / 2;
      ctx.globalAlpha = b.alpha;
      ctx.drawImage(sprite, b.x - b.size / 2, y - b.size / 2, b.size, b.size);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy -= 40 * dt;
      const fade = 1 - p.age / p.life;
      ctx.globalAlpha = fade;
      ctx.fillStyle = `rgba(${accentRgb},${0.9 * fade})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  retint();
  seed();
  requestAnimationFrame(frame);
  return { retint, burst };
})();

(() => {
  const canvas = $('grain');
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(canvas.width, canvas.height);
  const data = image.data;
  function paint() {
    for (let i = 0; i < data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      data[i] = v;
      data[i + 1] = v;
      data[i + 2] = v;
      data[i + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
  }
  paint();
  setInterval(paint, 90);
})();

const sound = (() => {
  let ctx = null;
  let comp = null;
  let master = null;
  let verb = null;
  let noise = null;
  let drone = null;
  let volume = 0.8;

  function start(level) {
    volume = level;
    if (!ctx) build();
    master.gain.value = volume;
    return ctx.resume();
  }

  function build() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 10;
    comp.ratio.value = 10;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    master = ctx.createGain();
    comp.connect(master).connect(ctx.destination);
    verb = ctx.createConvolver();
    verb.buffer = impulse(3);
    const verbReturn = ctx.createGain();
    verbReturn.gain.value = 0.4;
    verb.connect(verbReturn).connect(comp);
    noise = noiseBuffer(2);
    drone = buildDrone();
  }

  function impulse(seconds) {
    const length = Math.floor(ctx.sampleRate * seconds);
    const buffer = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buffer.getChannelData(c);
      for (let i = 0; i < length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.6);
    }
    return buffer;
  }

  function noiseBuffer(seconds) {
    const length = Math.floor(ctx.sampleRate * seconds);
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const d = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) d[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function send(node, wet) {
    node.connect(comp);
    if (wet <= 0) return;
    const g = ctx.createGain();
    g.gain.value = wet;
    node.connect(g).connect(verb);
  }

  function noiseSource(time, duration) {
    const src = ctx.createBufferSource();
    src.buffer = noise;
    src.loop = true;
    src.start(time);
    src.stop(time + duration);
    return src;
  }

  function env(param, time, peak, attack, decay) {
    param.setValueAtTime(0, time);
    param.linearRampToValueAtTime(peak, time + attack);
    param.exponentialRampToValueAtTime(0.0005, time + attack + decay);
  }

  function ramp(param, value, seconds) {
    const t = ctx.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(value, t + seconds);
  }

  function buildDrone() {
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 110;
    filter.Q.value = 6;
    const gain = ctx.createGain();
    gain.gain.value = 0;
    for (const [freq, detune] of [[41.2, -8], [55, 9]]) {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      osc.detune.value = detune;
      osc.connect(filter);
      osc.start();
    }
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.06;
    const depth = ctx.createGain();
    depth.gain.value = 50;
    lfo.connect(depth).connect(filter.frequency);
    lfo.start();
    filter.connect(gain);
    send(gain, 0.5);
    return { gain, filter };
  }

  function droneIn(seconds) {
    ramp(drone.gain.gain, 0.32, seconds);
  }

  function droneOut(seconds) {
    ramp(drone.gain.gain, 0, seconds);
  }

  function swell(seconds) {
    ramp(drone.gain.gain, 0.62, seconds);
    ramp(drone.filter.frequency, 420, seconds);
  }

  function settle() {
    ramp(drone.gain.gain, 0.32, 1.5);
    ramp(drone.filter.frequency, 110, 2);
  }

  function clang({ base = 180 + Math.random() * 80, decay = 1 + Math.random(), gain = 0.5, time = ctx.currentTime, wet = 0.6 } = {}) {
    const bus = ctx.createGain();
    bus.gain.value = gain;
    send(bus, wet);
    [1, 2.76, 5.4, 8.93, 13.34].forEach((ratio, i) => {
      const osc = ctx.createOscillator();
      osc.type = i < 2 ? 'triangle' : 'sine';
      osc.frequency.value = base * ratio * (1 + (Math.random() - 0.5) * 0.04);
      const g = ctx.createGain();
      env(g.gain, time, 1 / Math.pow(i + 1, 1.1), 0.004, decay * (1 - i * 0.13));
      osc.connect(g).connect(bus);
      osc.start(time);
      osc.stop(time + decay + 0.2);
    });
    const burst = noiseSource(time, 0.25);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2200 + Math.random() * 1800;
    bp.Q.value = 1.4;
    const bg = ctx.createGain();
    env(bg.gain, time, 0.7, 0.002, 0.12);
    burst.connect(bp).connect(bg).connect(bus);
  }

  function boom({ gain = 0.9, time = ctx.currentTime } = {}) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, time);
    osc.frequency.exponentialRampToValueAtTime(35, time + 0.6);
    const g = ctx.createGain();
    env(g.gain, time, gain, 0.012, 1.1);
    osc.connect(g);
    send(g, 0.2);
    osc.start(time);
    osc.stop(time + 1.4);
    const thump = noiseSource(time, 0.3);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 160;
    const tg = ctx.createGain();
    env(tg.gain, time, 1.2, 0.005, 0.18);
    thump.connect(lp).connect(tg);
    send(tg, 0.1);
  }

  function riser(seconds, { gain = 0.5, time = ctx.currentTime } = {}) {
    const src = noiseSource(time, seconds + 0.1);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.6;
    bp.frequency.setValueAtTime(180, time);
    bp.frequency.exponentialRampToValueAtTime(6500, time + seconds);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(gain, time + seconds);
    g.gain.setValueAtTime(0, time + seconds + 0.02);
    src.connect(bp).connect(g);
    send(g, 0.5);
    const tone = ctx.createOscillator();
    tone.type = 'sawtooth';
    tone.frequency.setValueAtTime(60, time);
    tone.frequency.exponentialRampToValueAtTime(520, time + seconds);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(300, time);
    lp.frequency.exponentialRampToValueAtTime(3000, time + seconds);
    const tg = ctx.createGain();
    tg.gain.setValueAtTime(0.0001, time);
    tg.gain.exponentialRampToValueAtTime(gain * 0.35, time + seconds);
    tg.gain.setValueAtTime(0, time + seconds + 0.02);
    tone.connect(lp).connect(tg);
    send(tg, 0.4);
    tone.start(time);
    tone.stop(time + seconds + 0.1);
  }

  function hit() {
    clang();
    boom();
  }

  function bigHit() {
    const t = ctx.currentTime;
    clang({ base: 120 + Math.random() * 30, decay: 2.6, gain: 0.8, time: t });
    clang({ base: 200 + Math.random() * 40, decay: 1.8, gain: 0.4, time: t + 0.03 });
    boom({ gain: 1.2, time: t });
  }

  function plateHit() {
    clang({ base: 420 + Math.random() * 160, decay: 0.45, gain: 0.16, wet: 0.3 });
  }

  function tension(seconds) {
    swell(seconds);
    riser(seconds, { gain: 0.22 });
  }

  function setVolume(level) {
    volume = level;
    if (master) master.gain.value = level;
  }

  function stop() {
    if (ctx) droneOut(0.4);
  }

  return { start, hit, bigHit, plateHit, tension, settle, riser, swell, droneIn, setVolume, stop };
})();

function setTheme(next) {
  theme = next === 'red' ? 'red' : 'blue';
  document.documentElement.dataset.theme = theme;
  for (const button of ui.themeSeg.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button.dataset.theme === theme));
  }
  fog.retint();
}

function readStored() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

function store(setup) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(setup));
  } catch {}
}

function parseTeams(text) {
  return text.split('\n').map((line) => line.trim()).filter(Boolean).slice(0, 16);
}

function currentSetup() {
  return {
    header: ui.header.value.trim() || DEFAULTS.header,
    theme,
    teams: ui.teams.value,
    seconds: Number(ui.seconds.value),
    volume: Number(ui.volume.value)
  };
}

function applySetup(setup) {
  ui.header.value = setup.header;
  ui.teams.value = setup.teams;
  ui.seconds.value = setup.seconds;
  ui.volume.value = setup.volume;
  setTheme(setup.theme);
  refreshOutputs();
}

function refreshOutputs() {
  const count = parseTeams(ui.teams.value).length;
  ui.countOut.textContent = `${count} ${count === 1 ? 'team' : 'teams'}`;
  ui.secondsOut.textContent = `${ui.seconds.value} s`;
  ui.volumeOut.textContent = `${Math.round(ui.volume.value * 100)}%`;
  ui.start.disabled = count === 0;
}

function setupFromUrl(setup) {
  if (params.has('header')) setup.header = params.get('header');
  if (params.has('theme')) setup.theme = params.get('theme');
  if (params.has('teams')) setup.teams = params.get('teams').split(/[|,]/).join('\n');
  if (params.has('seconds')) setup.seconds = Number(params.get('seconds'));
  return setup;
}

function setPhase(phase) {
  document.body.dataset.phase = phase;
}

function pulse(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function flash() {
  pulse(show.flash, 'on');
}

function shake(big) {
  show.world.classList.remove('shake', 'shake-big');
  void show.world.offsetWidth;
  show.world.classList.add(big ? 'shake-big' : 'shake');
}

function measureWidth(text, size, spacing) {
  show.measure.style.fontSize = `${size}px`;
  show.measure.style.letterSpacing = spacing;
  show.measure.textContent = text;
  return show.measure.offsetWidth;
}

function fitSize(text, { max, min, spacing, width }) {
  let size = max;
  while (size > min && measureWidth(text, size, spacing) > width) size -= 2;
  return size;
}

function stageRect(el) {
  const r = el.getBoundingClientRect();
  const s = show.stage.getBoundingClientRect();
  const scale = s.width / WIDTH;
  return { x: (r.left - s.left) / scale, y: (r.top - s.top) / scale, w: r.width / scale, h: r.height / scale };
}

async function pausableWait(ms) {
  let remaining = ms;
  while (remaining > 0 && !skipRequested) {
    if (paused) {
      await wait(60);
      continue;
    }
    const step = Math.min(60, remaining);
    await wait(step);
    remaining -= step;
  }
}

function buildHeader(text, scattered) {
  show.header.textContent = '';
  for (const ch of text) {
    const span = document.createElement('span');
    span.className = 'metal';
    span.textContent = ch === ' ' ? ' ' : ch;
    span.style.setProperty('--dx', scattered ? `${(Math.random() - 0.5) * 420}px` : '0px');
    span.style.setProperty('--dy', scattered ? `${(Math.random() - 0.5) * 260}px` : '0px');
    span.style.setProperty('--d', scattered ? `${Math.random() * 0.9}s` : '0s');
    show.header.appendChild(span);
  }
}

async function intro(setup, alive) {
  const t = TEST ? 0.35 : 1;
  show.header.className = 'glow';
  show.header.style.setProperty('--header-size', `${fitSize(setup.header, { max: 76, min: 34, spacing: '.2em', width: 1700 })}px`);
  buildHeader(setup.header, true);
  show.curtain.style.transition = 'none';
  show.curtain.style.opacity = '1';
  void show.curtain.offsetWidth;
  show.curtain.style.transition = '';
  await wait(300 * t);
  if (!alive()) return;
  sound.droneIn(3 * t);
  show.curtain.style.opacity = '0';
  await wait(1100 * t);
  if (!alive()) return;
  show.header.classList.add('assembled');
  await wait(1900 * t);
  if (!alive()) return;
  sound.hit();
  flash();
  shake(true);
  pulse(show.header, 'flicker');
  await wait(2500 * t);
  if (!alive()) return;
  show.header.classList.add('docked');
  await wait(1000 * t);
}

function buildStack(name) {
  show.stack.textContent = '';
  const size = fitSize(name, { max: 118, min: 22, spacing: '.14em', width: 1680 });
  show.stack.style.setProperty('--name-size', `${size}px`);
  const levels = [{ o: 1, b: 0 }, { o: 0.55, b: 1.4 }, { o: 0.3, b: 3 }, { o: 0.14, b: 5 }];
  let front = null;
  for (const k of [-3, 3, -2, 2, -1, 1, 0]) {
    const depth = Math.abs(k);
    const copy = document.createElement('div');
    copy.className = k === 0 ? 'copy front' : 'copy';
    copy.style.setProperty('--y', `${k * 150}px`);
    copy.style.setProperty('--z', `${-depth * 260}px`);
    const inner = document.createElement('span');
    inner.className = 'copy-inner metal';
    inner.textContent = name;
    inner.style.setProperty('--o', levels[depth].o);
    inner.style.setProperty('--b', `${levels[depth].b}px`);
    copy.appendChild(inner);
    if (k === 0) {
      front = copy;
      for (const side of ['l', 'r']) {
        const ab = document.createElement('span');
        ab.className = `ab ${side}`;
        ab.textContent = name;
        copy.appendChild(ab);
      }
    }
    show.stack.appendChild(copy);
  }
  return front;
}

async function revealTeam(index, alive) {
  const name = teams[index];
  skipRequested = false;
  show.label.className = '';
  show.label.textContent = `Team ${String(index + 1).padStart(2, '0')} of ${String(teams.length).padStart(2, '0')}`;
  const front = buildStack(name);
  show.stack.className = '';
  show.reveal.classList.add('on');
  sound.tension(1);
  await pausableWait(1000);
  if (!alive()) return;
  skipRequested = false;
  sound.hit();
  sound.settle();
  flash();
  shake(false);
  show.stack.classList.add('in');
  show.label.classList.add('in');
  await pausableWait((TEST ? 1 : holdSeconds) * 1000);
  if (!alive()) return;
  const rect = stageRect(front);
  show.stack.classList.remove('in');
  show.stack.classList.add('out');
  show.label.classList.remove('in');
  show.label.classList.add('out');
  fog.burst(rect);
  await wait(TEST ? 500 : 850);
  if (!alive()) return;
  show.stack.textContent = '';
}

function shuffle(list) {
  const out = list.slice();
  const random = new Uint32Array(1);
  for (let i = out.length - 1; i > 0; i--) {
    crypto.getRandomValues(random);
    const j = random[0] % (i + 1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function orderText() {
  return order.map((name, i) => `${i + 1}. ${name}`).join('\n');
}

function fitPlateName(el, max) {
  let size = max;
  el.style.fontSize = `${size}px`;
  while (size > 18 && el.scrollWidth > el.clientWidth) {
    size -= 1;
    el.style.fontSize = `${size}px`;
  }
  if (el.scrollWidth <= el.clientWidth) return;
  el.classList.add('wrap');
  while (size > 12 && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth)) {
    size -= 1;
    el.style.fontSize = `${size}px`;
  }
}

function buildPlates() {
  const count = order.length;
  const cols = count <= 6 ? 1 : 2;
  const rows = Math.ceil(count / cols);
  const gap = count > 12 ? 14 : 18;
  const available = HEIGHT - 176 - 64;
  const cap = cols === 1 ? 150 : 128;
  const plateHeight = Math.floor(Math.min(cap, (available - gap * (rows - 1)) / rows));
  const tier = count > 12 ? 2 : cols === 1 ? 0 : 1;
  const numSizes = [58, 46, 34];
  const nameSizes = [46, 36, 27];
  show.plates.style.setProperty('--cols', cols);
  show.plates.style.setProperty('--plate-h', `${plateHeight}px`);
  show.plates.style.setProperty('--gap', `${gap}px`);
  show.plates.style.setProperty('--num-size', `${numSizes[tier]}px`);
  show.plates.style.setProperty('--pname-size', `${nameSizes[tier]}px`);
  show.plates.textContent = '';
  order.forEach((name, i) => {
    const plate = document.createElement('div');
    plate.className = 'plate';
    const num = document.createElement('span');
    num.className = 'num metal glow';
    num.textContent = String(i + 1).padStart(2, '0');
    const label = document.createElement('span');
    label.className = 'pname metal glow';
    label.textContent = name;
    plate.append(num, label);
    show.plates.appendChild(plate);
  });
  for (const label of show.plates.querySelectorAll('.pname')) fitPlateName(label, nameSizes[tier]);
}

async function landPlates(alive) {
  const plates = [...show.plates.children];
  for (const plate of plates) plate.classList.remove('land');
  void show.plates.offsetWidth;
  for (const plate of plates) {
    plate.classList.add('land');
    sound.plateHit();
    await wait(150);
    if (!alive()) return;
  }
}

function scrambleHeader(target, duration) {
  const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  show.header.classList.remove('docked');
  show.header.classList.add('title');
  buildHeader(target, false);
  const spans = [...show.header.children];
  const start = performance.now();
  return new Promise((resolve) => {
    function tick(now) {
      const progress = Math.min(1, (now - start) / duration);
      spans.forEach((span, i) => {
        const ch = target[i];
        if (ch === ' ') return;
        const settleAt = 0.3 + (i / target.length) * 0.7;
        span.textContent = progress >= settleAt ? ch : glyphs[(Math.random() * glyphs.length) | 0];
      });
      if (progress < 1) requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });
}

async function finale(alive) {
  show.reveal.classList.remove('on');
  const riserSeconds = TEST ? 1.4 : 2.4;
  sound.riser(riserSeconds, { gain: 0.6 });
  sound.swell(riserSeconds);
  await wait(riserSeconds * 1000);
  if (!alive()) return;
  sound.bigHit();
  sound.settle();
  flash();
  shake(true);
  order = shuffle(teams);
  buildPlates();
  show.final.classList.add('on');
  setPhase('final');
  scrambleHeader('ORDER OF PRESENTATION', 1100);
  await wait(350);
  if (!alive()) return;
  await landPlates(alive);
  console.log(orderText());
}

async function runShow(setup) {
  const id = ++runId;
  const alive = () => id === runId;
  paused = false;
  skipRequested = false;
  order = [];
  setPhase('intro');
  await intro(setup, alive);
  if (!alive()) return;
  setPhase('reveal');
  for (let i = 0; i < teams.length; i++) {
    await revealTeam(i, alive);
    if (!alive()) return;
  }
  await finale(alive);
}

function startShow(event) {
  event.preventDefault();
  const setup = currentSetup();
  teams = parseTeams(setup.teams);
  if (!teams.length) return;
  store(setup);
  holdSeconds = setup.seconds;
  sound.start(setup.volume);
  runShow(setup);
}

function stopShow() {
  runId++;
  paused = false;
  skipRequested = false;
  sound.stop();
  show.reveal.classList.remove('on');
  show.final.classList.remove('on');
  show.stack.textContent = '';
  show.plates.textContent = '';
  show.header.textContent = '';
  show.header.className = 'glow';
  show.world.classList.remove('shake', 'shake-big');
  show.curtain.style.opacity = '0';
  setPhase('setup');
}

function reshuffle() {
  if (!confirm('Reshuffle the order of presentation?')) return;
  const id = runId;
  order = shuffle(teams);
  buildPlates();
  landPlates(() => id === runId);
  console.log(orderText());
}

function fallbackCopy(text) {
  const area = document.createElement('textarea');
  area.value = text;
  document.body.appendChild(area);
  area.select();
  document.execCommand('copy');
  area.remove();
}

let toastTimer = 0;
async function copyOrder() {
  if (!order.length) return;
  const text = orderText();
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    fallbackCopy(text);
  }
  show.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => show.toast.classList.remove('show'), 1000);
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}

addEventListener('keydown', (event) => {
  const phase = document.body.dataset.phase;
  const typing = /^(INPUT|TEXTAREA)$/.test(event.target.tagName);
  if (event.key === 'f' || event.key === 'F') {
    if (typing) return;
    event.preventDefault();
    toggleFullscreen();
    return;
  }
  if (phase === 'setup') return;
  if (event.key === 'Escape') {
    event.preventDefault();
    stopShow();
    return;
  }
  if (event.key === ' ') {
    event.preventDefault();
    paused = !paused;
    return;
  }
  if (event.key === 'ArrowRight') {
    event.preventDefault();
    skipRequested = true;
    return;
  }
  if ((event.key === 'c' || event.key === 'C') && !event.metaKey && !event.ctrlKey) {
    copyOrder();
    return;
  }
  if (event.key === 'R' && event.shiftKey && phase === 'final') {
    event.preventDefault();
    reshuffle();
  }
});

ui.form.addEventListener('submit', startShow);
ui.teams.addEventListener('input', refreshOutputs);
ui.seconds.addEventListener('input', refreshOutputs);
ui.volume.addEventListener('input', () => {
  refreshOutputs();
  sound.setVolume(Number(ui.volume.value));
});
ui.test.addEventListener('click', () => {
  sound.start(Number(ui.volume.value));
  sound.hit();
});
ui.themeSeg.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-theme]');
  if (button) setTheme(button.dataset.theme);
});
addEventListener('resize', fitStage);

fitStage();
applySetup(setupFromUrl({ ...DEFAULTS, ...readStored() }));
</script>
</body>
</html>
