:root{
--font:"Michroma","Eurostile Extended","Arial Black",sans-serif;
--accent:#62d6ff;
--accent-rgb:98,214,255;
--time-gradient:linear-gradient(180deg,#f3f6f9 0%,#aeb8c3 30%,#5c6975 50%,#d6dee5 53%,#7d8994 78%,#eaeff3 100%);
}
:root[data-theme="red"]{--accent:#ff5a3c;--accent-rgb:255,90,60}
body.warn{--accent:#ffb347;--accent-rgb:255,179,71;--time-gradient:linear-gradient(180deg,#fff3dc 0%,#ffc96e 30%,#b86a12 50%,#ffd38a 53%,#c98424 78%,#ffe8c0 100%)}
body.critical,body.over{--accent:#ff3b3b;--accent-rgb:255,59,59;--time-gradient:linear-gradient(180deg,#ffdede 0%,#ff7070 30%,#9e1212 50%,#ff8f8f 53%,#b51c1c 78%,#ffd4d4 100%)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{font-family:var(--font);text-transform:uppercase;color:#dfe6ec;-webkit-font-smoothing:antialiased}
#bar{position:relative;height:100vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 56px;background:linear-gradient(180deg,rgba(8,12,18,.9),rgba(3,5,8,.95));border-top:1px solid rgba(var(--accent-rgb),.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
#bar::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 5px);pointer-events:none}
#bar::after{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:radial-gradient(ellipse 30% 100% at 50% 0%,rgba(var(--accent-rgb),.14),transparent 70%);pointer-events:none}
#label{display:flex;align-items:center;gap:22px;font-size:24px;letter-spacing:.42em;color:rgba(var(--accent-rgb),.95);text-shadow:0 0 14px rgba(var(--accent-rgb),.55);white-space:nowrap}
#label small{display:none;font-size:11px;letter-spacing:.35em;color:#8d99a6;border:1px solid rgba(255,255,255,.2);padding:6px 10px;text-shadow:none}
body.paused #label small{display:inline-block}
#time{font-size:72px;letter-spacing:.1em;line-height:1;padding:0 .12em;background-image:var(--time-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px rgba(255,255,255,.22);filter:drop-shadow(0 0 16px rgba(var(--accent-rgb),.55)) drop-shadow(0 3px 3px rgba(0,0,0,.9));font-variant-numeric:tabular-nums}
#next{justify-self:end;font-size:14px;letter-spacing:.35em;color:#6f7d8b;white-space:nowrap}
#progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06)}
#progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,rgba(var(--accent-rgb),.55),var(--accent));box-shadow:0 0 12px rgba(var(--accent-rgb),.8);transform-origin:left center;transform:scaleX(var(--p,1))}
body.critical #time{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1);filter:drop-shadow(0 0 10px rgba(var(--accent-rgb),.45))}to{transform:scale(1.05);filter:drop-shadow(0 0 28px rgba(var(--accent-rgb),.95))}}
body.over #time{animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:.12}}
</style>
</head>
<body>
<div id="bar">
<div id="label"><span id="label-text"></span><small>Paused</small></div>
<div id="time">00:00</div>
<div id="next"></div>
<div id="progress"><i id="fill"></i></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const minutes = Number(params.get('min')) || 3;
const qa = Number(params.get('qa')) || 0;
document.documentElement.dataset.theme = params.get('theme') === 'red' ? 'red' : 'blue';

const segments = [{ label: params.get('label') || 'PRESENTATION', seconds: minutes * 60 }];
if (qa > 0) segments.push({ label: 'Q&A', seconds: qa * 60 });

const labelEl = document.getElementById('label-text');
const timeEl = document.getElementById('time');
const nextEl = document.getElementById('next');
const fillEl = document.getElementById('fill');

let index = 0;
let total = 1;
let remaining = 0;
let paused = false;
let over = false;
let last = performance.now();

function format(seconds) {
  const whole = Math.max(0, Math.ceil(seconds));
  return `${String(Math.floor(whole / 60)).padStart(2, '0')}:${String(whole % 60).padStart(2, '0')}`;
}

function startSegment(i) {
  index = i;
  total = segments[i].seconds;
  remaining = total;
  over = false;
  labelEl.textContent = segments[i].label;
  const next = segments[i + 1];
  nextEl.textContent = next ? `Next · ${next.label} ${format(next.seconds)}` : '';
}

function finish() {
  over = true;
  remaining = 0;
  timeEl.textContent = 'TIME';
  nextEl.textContent = '';
}

function render() {
  document.body.classList.toggle('warn', !over && remaining < 30 && remaining >= 10);
  document.body.classList.toggle('critical', !over && remaining < 10);
  document.body.classList.toggle('over', over);
  document.body.classList.toggle('paused', paused && !over);
  if (!over) timeEl.textContent = format(remaining);
  fillEl.style.setProperty('--p', over ? 0 : remaining / total);
}

function tick(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (!paused && !over) {
    remaining -= dt;
    if (remaining <= 0) {
      if (segments[index + 1]) startSegment(index + 1);
      else finish();
    }
  }
  render();
  requestAnimationFrame(tick);
}

addEventListener('keydown', (event) => {
  if (event.key === ' ') {
    event.preventDefault();
    if (!over) paused = !paused;
    return;
  }
  if (event.key === 'r' || event.key === 'R') {
    paused = false;
    startSegment(0);
  }
});

startSegment(0);
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
